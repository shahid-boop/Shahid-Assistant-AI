[package]
name = "shahid-assistant"
version = "0.1.0"
description = "Shahid Assistant Windows desktop AI workspace"
authors = ["Shahid Assistant"]
edition = "2021"

[lib]
name = "shahid_assistant_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
